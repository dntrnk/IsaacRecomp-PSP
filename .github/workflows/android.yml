# Builds the Android APK on GitHub's servers. Download it from the "Actions" tab: open the latest
# "Android APK" run and get the "IsaacRecomp-Android" artifact (a .zip with the .apk inside).
name: Android APK

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    paths:
      - 'rt/**'
      - 'gen720/**'
      - 'third_party/**'
      - 'android/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android.yml'

jobs:
  apk:
    # pinned (instead of ubuntu-latest) so a new runner image can't change the toolchain under us
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Optional: a fixed signing key, so new versions install over old ones without uninstalling.
      # Add the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
      # ANDROID_KEY_PASSWORD (see android/README.md). Without them the APK is signed with a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/isaac.keystore"
            echo "ISAAC_KEYSTORE=$RUNNER_TEMP/isaac.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: android
        env:
          ISAAC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ISAAC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ISAAC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/release/*.apk ../out/IsaacRecomp.apk

      - uses: actions/upload-artifact@v6
        with:
          name: IsaacRecomp-Android
          path: out/IsaacRecomp.apk
          if-no-files-found: error
